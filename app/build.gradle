plugins { id 'com.android.application' }
android {
    namespace 'io.github.mmarkimark.llartv'
    compileSdk 33
    buildToolsVersion "36.0.0"
    defaultConfig {
        applicationId 'io.github.mmarkimark.llartv'
        minSdk 28          // TV runs Android 9
        targetSdk 33
        versionCode 11
        versionName '1.10'
    }
    // The published APK is this debug build (same certificate as every release, so it installs in place), shrunk
    // with R8 since v1.9 (#104): about 0.7 MB instead of 4.2 MB. Keep the mapping file of every release
    // (app/build/outputs/mapping/debug/mapping.txt) with its assets; see CONTRIBUTING.md#releases.
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'   // real org.json for JVM tests (android.jar only has stubs)
}
